name: Build

# Builds the mod on every push, pull request or manual run.
# Pushing a tag like v1.0.0 also creates a GitHub Release with the jar attached.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew build --no-daemon -Pmod_version="${GITHUB_REF_NAME#v}"
          else
            ./gradlew build --no-daemon
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: orbital_laser
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
